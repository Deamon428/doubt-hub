<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoubtHub | Student Escalation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl">
        <!-- Header -->
        <div class="mb-8 text-center">
            <div
                class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-medium mb-3">
                Tutorial Queue Escalation
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-white">DoubtHub</h1>
            <p class="text-zinc-400 text-sm mt-1">When generic AI explanations fall short, escalate directly to your
                tutorial TA.</p>
        </div>

        <!-- Main Card -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 sm:p-8 shadow-xl">
            <form id="doubt-form" class="space-y-5">

                <!-- Metadata Row -->
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label
                            class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Course</label>
                        <input id="course_id" type="text" value="UMA023" required
                            class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Sheet
                            #</label>
                        <input id="sheet_no" type="number" value="3" required
                            class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
                    </div>
                    <div>
                        <label
                            class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Question</label>
                        <input id="question_no" type="text" value="4b" required
                            class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" />
                    </div>
                </div>

                <!-- Doubt Field -->
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Your
                        Specific Roadblock</label>
                    <textarea id="doubt_text" rows="3" required
                        placeholder="Describe the step, formula, or derivation where you got stuck..."
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"></textarea>
                </div>

                <!-- AI Failure Field -->
                <div>
                    <label
                        class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                        <span>Where did ChatGPT / Gemini fail?</span>
                        <span class="text-indigo-400 normal-case font-normal text-xs">Crucial for TA context</span>
                    </label>
                    <textarea id="ai_failure_reason" rows="3" required
                        placeholder="e.g. AI assumed repeated roots, but sir's equation used fixed-end boundary conditions..."
                        class="w-full bg-zinc-950 border border-indigo-500/30 rounded-lg p-3 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"></textarea>
                </div>

                <!-- Submit Button -->
                <button id="submit-btn" type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg transition duration-150 flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                    <span>Escalate to Tutorial Queue</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </form>

            <!-- Success Notification (Hidden by default) -->
            <div id="result-box"
                class="hidden mt-6 p-4 rounded-xl bg-emerald-950/40 border border-emerald-500/30 text-emerald-200">
                <div class="flex items-start gap-3">
                    <svg class="w-5 h-5 text-emerald-400 mt-0.5 shrink-0" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <div>
                        <h4 class="text-sm font-semibold text-white">Roadblock Logged & Clustered</h4>
                        <p class="text-xs text-emerald-300/80 mt-0.5">Your doubt has been linked with peers for the
                            upcoming tutorial session.</p>
                        <div id="cluster-tag"
                            class="mt-2 inline-block px-2.5 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-mono text-xs font-semibold">
                            Cluster Assigned
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('doubt-form');
        const submitBtn = document.getElementById('submit-btn');
        const resultBox = document.getElementById('result-box');
        const clusterTag = document.getElementById('cluster-tag');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Clustering & Submitting...';

            const payload = {
                course_id: document.getElementById('course_id').value,
                sheet_no: parseInt(document.getElementById('sheet_no').value),
                question_no: document.getElementById('question_no').value,
                doubt_text: document.getElementById('doubt_text').value,
                ai_failure_reason: document.getElementById('ai_failure_reason').value,
            };

            try {
                const res = await fetch('/api/doubts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                resultBox.classList.remove('hidden');
                clusterTag.textContent = `Cluster #${data.cluster_id} • Queued for TA`;
                document.getElementById('doubt_text').value = '';
                document.getElementById('ai_failure_reason').value = '';
            } catch (err) {
                alert('Failed to connect to backend server. Make sure FastAPI is running.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Escalate to Tutorial Queue</span> <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
            }
        });
    </script>
</body>

</html>
